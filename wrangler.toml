name = "glassmax-site-worker"
compatibility_date = "2024-09-23"
main = "worker/index.ts"

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[routes]]
pattern = "glassmax.in/*"
zone_name = "glassmax.in"

[[routes]]
pattern = "www.glassmax.in/*"
zone_name = "glassmax.in"
